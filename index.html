<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tap Counter">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Tap Counter</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; background: #0b1020; color: #f8fafc;
      display: grid; place-items: center; padding: 24px;
    }
    main { width: min(100%, 440px); text-align: center; }
    .eyebrow { color: #a5b4fc; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { font-size: clamp(28px, 8vw, 40px); margin: 12px 0 34px; }
    #counter {
      width: min(78vw, 320px); aspect-ratio: 1; border: 0; border-radius: 50%;
      background: linear-gradient(145deg, #6366f1, #4338ca); color: white;
      box-shadow: 0 18px 55px #4f46e566, inset 0 2px 0 #ffffff40;
      font-size: clamp(64px, 18vw, 100px); font-weight: 750; font-variant-numeric: tabular-nums;
      cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    }
    #counter:active { transform: scale(.97); }
    #counter:focus-visible, .reset:focus-visible { outline: 4px solid #fbbf24; outline-offset: 5px; }
    .hint { color: #cbd5e1; margin: 24px 0 30px; }
    .reset {
      border: 1px solid #475569; color: #e2e8f0; background: #1e293b;
      border-radius: 999px; padding: 12px 22px; font-size: 15px; cursor: pointer;
    }
    .reset:active { background: #334155; }
    .saved { color: #94a3b8; font-size: 12px; margin-top: 22px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Tap counter</div>
    <h1>Your count</h1>
    <button id="counter" type="button" aria-label="Increase count">0</button>
    <p class="hint">Tap the big button to count up.</p>
    <button class="reset" id="reset" type="button">Reset count</button>
    <p class="saved">Your count is saved on this device.</p>
  </main>
  <script>
    const countButton = document.getElementById("counter");
    const resetButton = document.getElementById("reset");
    let count = 0;
    try { count = Math.max(0, Number(localStorage.getItem("tap-counter-value")) || 0); } catch (_) {}
    function render() {
      countButton.textContent = count.toLocaleString();
      countButton.setAttribute("aria-label", `Current count ${count}. Tap to increase.`);
    }
    function save() {
      try { localStorage.setItem("tap-counter-value", String(count)); } catch (_) {}
    }
    countButton.addEventListener("click", () => { count += 1; save(); render(); });
    resetButton.addEventListener("click", () => {
      if (confirm("Reset the count to zero?")) { count = 0; save(); render(); }
    });
    render();
    if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./service-worker.js").catch(() => {}));
    }
  </script>
</body>
</html>
